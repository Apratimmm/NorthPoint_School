{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notices - North Point</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
@theme { --color-lime-cream:#f7fce8; --color-canary:#fde047; --color-ink:#0f172a; --font-sans:'Outfit',ui-sans-serif,system-ui,sans-serif; }
</style>
</head>
<body class="bg-lime-cream text-ink antialiased">
{% include 'header.html' %}
<main class="px-4 py-12">
    <div class="mx-auto max-w-5xl text-center mb-14">
    <h1 class="text-5xl font-bold text-ink tracking-tight">Notices</h1>
    <p class="mt-4 text-xl text-ink-light">Latest updates and announcements from the school.</p>
  </div>

  <div class="mx-auto max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-6">
  <section class="bg-white rounded-3xl border-2 border-black p-6 shadow-xl">
    <h2 class="text-3xl font-bold text-ink mb-3">Annual Day & Prize Distribution</h2>
    <span class="font-semibold uppercase tracking-wide text-canary-dark text-sm">SATURDAY, 13 DECEMBER 2025</span>
    <div class="w-full h-0.5 bg-black/20 my-6"></div>
    <div class="relative h-48">
      <div id="n1" class="gallery-slide relative h-full"><img src="https://images.unsplash.com/photo-1524178232363-1fb2b075b655?q=80&w=800" class="rounded-3xl border-2 border-black w-full h-full object-cover" alt="Event"></div>
      <div id="n2" class="gallery-slide hidden relative h-full"><img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?q=80&w=800" class="rounded-3xl border-2 border-black w-full h-full object-cover" alt="Event"></div>
      <button onclick="prevSlide(1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-white/90 border-2 border-black rounded-full p-2 shadow-lg hover:bg-canary">&#8249;</button>
      <button onclick="nextSlide(1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-white/90 border-2 border-black rounded-full p-2 shadow-lg hover:bg-canary">&#8250;</button>
    </div>
  </section>

  </section>
  <section class="bg-white rounded-3xl border-2 border-black p-6 shadow-xl">
    <h2 class="text-3xl font-bold text-ink mb-3">Inter-House Sports Meet</h2>
    <span class="font-semibold uppercase tracking-wide text-canary-dark text-sm">FRIDAY & SATURDAY, 21–22 NOVEMBER 2025</span>
    <div class="w-full h-0.5 bg-black/20 my-6"></div>
    <div class="relative h-48">
      <div id="n3" class="gallery-slide relative h-full"><img src="https://images.unsplash.com/photo-1461896836934-ffe607ba8211?q=80&w=800" class="rounded-3xl border-2 border-black w-full h-full object-cover" alt="Event"></div>
      <div id="n4" class="gallery-slide hidden relative h-full"><img src="https://images.unsplash.com/photo-1517649763962-0c623066013b?q=80&w=800" class="rounded-3xl border-2 border-black w-full h-full object-cover" alt="Event"></div>
      <button onclick="prevSlide(2)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-white/90 border-2 border-black rounded-full p-2 shadow-lg hover:bg-canary">&#8249;</button>
      <button onclick="nextSlide(2)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-white/90 border-2 border-black rounded-full p-2 shadow-lg hover:bg-canary">&#8250;</button>
    </div>
  </section>
</div>
</main>
<script>
function toggleCard(idx){ let n1=(idx===1)?"n1":"n3"; let n2=(idx===1)?"n2":"n4"; document.getElementById(n1).classList.toggle("hidden"); document.getElementById(n2).classList.toggle("hidden");}
function nextSlide(idx){ if(idx===1){ document.getElementById("n1").classList.add("hidden"); document.getElementById("n2").classList.remove("hidden"); } else { document.getElementById("n3").classList.add("hidden"); document.getElementById("n4").classList.remove("hidden"); }}
function prevSlide(idx){ if(idx===1){ document.getElementById("n1").classList.remove("hidden"); document.getElementById("n2").classList.add("hidden"); } else { document.getElementById("n3").classList.remove("hidden"); document.getElementById("n4").classList.add("hidden"); }}
</script>
{% include 'footer.html' %}
</body>
</html>
