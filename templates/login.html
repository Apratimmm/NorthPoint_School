{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - North Point</title>
    <meta name="description" content="Sign in to the North Point English Boarding School administration dashboard.">
    
    
    
    <link rel="stylesheet" href="{% static 'dist/tailwind.css' %}">
    <link rel="preconnect" href="https://res.cloudinary.com">
    <link rel="preload" href="{% static 'fonts/outfit-latin.woff2' %}" as="font" type="font/woff2" crossorigin>
</head>
<body class="bg-lime-cream text-ink antialiased flex flex-col min-h-screen">
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-sm border-b-2 border-black">
      <div class="flex w-full items-center justify-between px-6 py-4 lg:px-12">
        <a href="{% url 'home' %}" class="flex items-center gap-3 group">
            {% if logo_url %}
              <img src="{{ logo_url }}?f_auto,q_auto" alt="North Point Logo" class="h-14 w-14 rounded-xl object-contain" loading="lazy" width="56" height="56" decoding="async">
            {% else %}
              <picture>
                <source srcset="{% static 'logo.webp' %}" type="image/webp">
                <img src="{% static 'logo.png' %}" alt="North Point Logo" class="h-14 w-14 rounded-xl object-contain" loading="lazy" width="56" height="56" decoding="async">
              </picture>
            {% endif %}
          <div class="leading-tight">
            <span class="block text-lg font-bold tracking-tight text-ink">North Point</span>
            <span class="block text-xs font-medium uppercase tracking-wider text-ink-light">English Boarding School</span>
          </div>
        </a>

        <div class="flex items-center gap-8">
          <a href="{% url 'home' %}"><span class="text-xl font-bold tracking-tight text-ink">Home</span></a>
        </div>
      </div>

    </header>
    <main class="flex-grow flex flex-col items-center px-4 pt-8 pb-16 lg:pt-12 lg:pb-24">

        <div class="w-full max-w-md bg-white rounded-3xl p-8 sm:p-10 border-2 border-black">
            <h1 class="text-3xl font-bold text-ink tracking-tight text-center">Welcome back</h1>
            <p class="mt-2 text-base text-ink-light text-center">Please enter your details to sign in.</p>

            <form action="{% url 'verify_user' %}" method="POST" class="mt-8 space-y-5" autocomplete="off">
                {% csrf_token %}
                <div>
                    <label for="name" class="block text-sm font-semibold text-ink mb-2">Username</label>
                    <input type="text" name="name" id="name" autocomplete="off" required class="w-full rounded-xl border-2 border-black bg-lime-cream px-4 py-3 text-sm text-ink outline-none focus:border-canary focus:bg-white transition-all shadow-sm" placeholder="Enter username">
                </div>
                <div>
                    <label for="password" class="block text-sm font-semibold text-ink mb-2">Password</label>
                    <input type="password" name="password" id="password" autocomplete="new-password" required class="w-full rounded-xl border-2 border-black bg-lime-cream px-4 py-3 text-sm text-ink outline-none focus:border-canary focus:bg-white transition-all shadow-sm" placeholder="Enter password">
                </div>
                <button id="signInBtn" type="submit" class="mt-6 w-full rounded-full bg-canary hover:bg-canary-dark text-ink py-3.5 px-6 font-bold text-base shadow-md border-2 border-black transition-all hover:scale-[1.02] active:scale-[0.98] cursor-pointer">
                    Sign In
                </button>
            </form>
            <script>
              const btn = document.getElementById('signInBtn');
              btn.addEventListener('click', function(e) {
                e.preventDefault();
                btn.textContent = 'Signing...';
                btn.disabled = true;
                btn.style.cursor = 'not-allowed';
                btn.form.submit();
              });
            </script>
        </div>

        {% if messages %}
        <div class="w-full max-w-md mt-5 space-y-2">
            {% for message in messages %}
            <div class="rounded-2xl p-4 text-sm font-medium border-2 text-center shadow-sm {% if message.tags == 'error' %}bg-red-50 text-red-700 border-red-200{% else %}bg-lime-cream text-ink border-black/10{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

    </main>

</body>
</html>
